<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет | Библиотека</title>

    <!-- Bootstrap 5 CSS + Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

<div class="container py-4">
    <!-- Шапка с навигацией -->
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
        <h1 class="h2">
            <i class="bi bi-person-badge"></i> Личный кабинет
        </h1>
        <a th:href="@{/ui/books}" class="btn btn-outline-primary">
            <i class="bi bi-arrow-left"></i> Вернуться к каталогу
        </a>
    </div>

    <!-- Карточка пользователя -->
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <div class="d-flex align-items-center">
                <div class="me-3">
                    <i class="bi bi-person-circle" style="font-size: 3rem;"></i>
                </div>
                <div>
                    <h5 class="card-title mb-1">Добро пожаловать!</h5>
                    <p class="card-text fs-5 mb-0">
                        Пользователь: <strong th:text="${username}" class="text-primary"></strong>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- Секция текущих броней и выдач -->
    <div class="card shadow-sm">
        <div class="card-header bg-white">
            <h2 class="h4 mb-0">
                <i class="bi bi-bookmark-check-fill text-warning"></i> Текущие брони и выдачи
            </h2>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>Книга</th>
                        <th>Статус</th>
                        <th>Дата брони/выдачи</th>
                        <th>Срок возврата</th>
                    </tr>
                    </thead>
                    <tbody>
                    <!-- Пустое состояние -->
                    <tr th:if="${#lists.isEmpty(loans)}">
                        <td colspan="4" class="text-center text-muted py-5">
                            <i class="bi bi-inbox" style="font-size: 2rem; display: block;"></i>
                            Пока нет активных броней или выдач
                        </td>
                    </tr>

                    <!-- Список броней/выдач -->
                    <tr th:each="loan : ${loans}">
                        <td>
                            <strong th:text="${loan.book != null ? loan.book.title : 'Не указано'}"></strong>
                            <div th:if="${loan.book != null}" class="small text-muted">
                                <span th:if="${loan.book.author != null}" th:text="'Автор: ' + ${loan.book.author.fullName}"></span>
                            </div>
                        </td>
                        <td>
                            <!-- Цветные бейджи для разных статусов -->
                            <span th:switch="${loan.status}" class="badge"
                                  th:classappend="${loan.status == 'ACTIVE' ? 'bg-success' :
                                                  loan.status == 'BOOKED' ? 'bg-warning text-dark' :
                                                  loan.status == 'OVERDUE' ? 'bg-danger' : 'bg-secondary'}">
                                <i th:switch="${loan.status}" class="bi"
                                   th:case="'ACTIVE'" th:class="'bi-check-circle-fill'"></i>
                                <i th:case="'BOOKED'" th:class="'bi-bookmark-fill'"></i>
                                <i th:case="'OVERDUE'" th:class="'bi-exclamation-triangle-fill'"></i>
                                <i th:case="*" th:class="'bi-info-circle-fill'"></i>
                                <span th:text="${loan.status}"></span>
                            </span>
                        </td>
                        <td>
                            <i class="bi bi-calendar3 me-1"></i>
                            <span th:text="${#temporals.format(loan.loanDate, 'dd.MM.yyyy HH:mm')}"></span>
                        </td>
                        <td>
                            <i class="bi bi-calendar-exclamation me-1"></i>
                            <span th:text="${#temporals.format(loan.returnDeadline, 'dd.MM.yyyy')}"></span>
                            <!-- Иконка-предупреждение, если срок скоро истекает (можно настроить) -->
                            <i th:if="${loan.returnDeadline != null && #temporals.isAfter(#temporals.createNow(), #temporals.plusDays(#temporals.createNow(), 2))}"
                               class="bi bi-hourglass-split text-warning ms-1"
                               title="Осталось меньше 3 дней"></i>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Дополнительная информация (опционально) -->
    <div class="mt-4 text-muted text-center small">
        <i class="bi bi-info-circle"></i> Если у вас есть вопросы по бронированию, обратитесь к библиотекарю
    </div>
</div>

<!-- Bootstrap JS (для возможных интерактивных элементов) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
