<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Админ: Выдачи</title>
    <style>
        table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        th, td { padding: 8px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #f4f4f4; }
        .nav a { margin-right: 10px; }
    </style>
</head>
<body>
<div class="nav">
    <a th:href="@{/admin/books}">Книги</a>
    <a th:href="@{/admin/authors}">Авторы</a>
    <a th:href="@{/admin/genres}">Жанры</a>
    <a th:href="@{/admin/users}">Пользователи</a>
    <a th:href="@{/admin/loans}">Выдачи</a>
    <a th:href="@{/admin/stats}">Статистика</a>
</div>

<h1>Выдачи и брони</h1>

<h2>Бронирования</h2>
<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Книга</th>
        <th>Пользователь</th>
        <th>Дата брони</th>
        <th>Срок возврата</th>
        <th>Действия</th>
    </tr>
    </thead>
    <tbody>
    <tr th:if="${#lists.isEmpty(booked)}">
        <td colspan="6">Броней пока нет</td>
    </tr>
    <tr th:each="loan : ${booked}">
        <td th:text="${loan.id}"></td>
        <td th:text="${loan.book != null ? loan.book.title : 'Не указано'}"></td>
        <td th:text="${loan.user != null ? loan.user.username : 'Не указан'}"></td>
        <td th:text="${loan.loanDate}"></td>
        <td th:text="${loan.returnDeadline}"></td>
        <td>
            <form th:action="@{/admin/loans/issue}" method="post">
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <input type="hidden" name="loanId" th:value="${loan.id}" />
                <button type="submit">Выдать</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

<h2>Выданные книги</h2>
<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Книга</th>
        <th>Пользователь</th>
        <th>Дата выдачи</th>
        <th>Срок возврата</th>
        <th>Действия</th>
    </tr>
    </thead>
    <tbody>
    <tr th:if="${#lists.isEmpty(borrowed)}">
        <td colspan="6">Выданных книг пока нет</td>
    </tr>
    <tr th:each="loan : ${borrowed}">
        <td th:text="${loan.id}"></td>
        <td th:text="${loan.book != null ? loan.book.title : 'Не указано'}"></td>
        <td th:text="${loan.user != null ? loan.user.username : 'Не указан'}"></td>
        <td th:text="${loan.loanDate}"></td>
        <td th:text="${loan.returnDeadline}"></td>
        <td>
            <form th:action="@{/admin/loans/return}" method="post">
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <input type="hidden" name="loanId" th:value="${loan.id}" />
                <button type="submit">Вернуть</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
