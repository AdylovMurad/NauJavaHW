<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Админ: Пользователи</title>
    <style>
        table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        th, td { padding: 8px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #f4f4f4; }
        .nav a { margin-right: 10px; }
    </style>
</head>
<body>
<div class="nav">
    <a th:href="@{/admin/books}">Книги</a>
    <a th:href="@{/admin/authors}">Авторы</a>
    <a th:href="@{/admin/genres}">Жанры</a>
    <a th:href="@{/admin/users}">Пользователи</a>
    <a th:href="@{/admin/loans}">Выдачи</a>
    <a th:href="@{/admin/stats}">Статистика</a>
</div>

<h1>Пользователи</h1>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Логин</th>
        <th>Email</th>
        <th>Имя</th>
        <th>Фамилия</th>
        <th>Роль</th>
    </tr>
    </thead>
    <tbody>
    <tr th:if="${#lists.isEmpty(users)}">
        <td colspan="6">Пользователей пока нет</td>
    </tr>
    <tr th:each="user : ${users}">
        <td th:text="${user.id}"></td>
        <td th:text="${user.username}"></td>
        <td th:text="${user.email}"></td>
        <td th:text="${user.firstName}"></td>
        <td th:text="${user.lastName}"></td>
        <td th:text="${user.role}"></td>
    </tr>
    </tbody>
</table>
</body>
</html>
